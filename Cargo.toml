[package]
name = "kebabify"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
authors = ["kebab1337420"]
description = "Spicetify-like extension for Spotify: ad-free, lossless audio via Soulseek P2P with lucida.to and JioSaavn fallback"
license = "MIT"
repository = "https://github.com/kebab1337420/kebabify"
readme = "README.md"
exclude = ["icons/*"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "io-util", "macros", "process"] }

# HTTP client for the audio proxy
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde_json = "1"

# SHA-256 verification of release assets (self-update channel)
sha2 = "0.10"

# JioSaavn media URL decryption (DES-ECB, see saavn.rs)
des = "0.8"
cipher = "0.4"
base64 = "0.22"

# Percent-encoding for the lucida resolve URL (already in the tree via url/reqwest)
percent-encoding = "2"

# Chrome DevTools Protocol (cookie import from a real browser)
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Firefox-family cookie store (cookies.sqlite) for the cookie import.
# Optional: `--no-default-features` drops bundled SQLite (Chromium CDP
# import keeps working; Firefox import errors politely).
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[features]
default = ["firefox-import"]
firefox-import = ["dep:rusqlite"]

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

# Utility
anyhow = "1"
clap = { version = "4", features = ["derive"] }
open = "5"
url = "2"
which = "8"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Deps stay speed-optimized while the binary itself optimizes for size.
[profile.release.package."*"]
opt-level = 3