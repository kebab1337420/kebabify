[package]
name = "kebabify"
version = "0.5.0"
edition = "2021"
authors = ["kebab1337420"]
description = "Spicetify-like extension for Spotify: ad-free, lossless audio via lucida.to API with JioSaavn fallback"
license = "MIT"
repository = "https://github.com/kebab1337420/kebabify"
readme = "README.md"
exclude = ["icons/*"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "io-util", "macros"] }

# HTTP client for the audio proxy
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde_json = "1"

# SHA-256 verification of release assets (self-update channel)
sha2 = "0.10"

# JioSaavn media URL decryption (DES-ECB, see saavn.rs)
des = "0.8"
cipher = "0.4"
base64 = "0.22"

# Percent-encoding for the lucida resolve URL (already in the tree via url/reqwest)
percent-encoding = "2"

# Chrome DevTools Protocol (cookie import from a real browser)
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Firefox-family cookie store (cookies.sqlite) for the cookie import
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Utility
anyhow = "1"
clap = { version = "4", features = ["derive"] }
open = "5"
url = "2"
which = "8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Deps stay speed-optimized while the binary itself optimizes for size.
[profile.release.package."*"]
opt-level = 3