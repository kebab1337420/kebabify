name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - run: rustup override set 1.98.0
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
      # The rusqlite feature gate must compile (and test) on its own.
      - run: cargo check --no-default-features --locked
      - run: cargo test --no-default-features --locked

  # Validates what releases actually ship (release profile: LTO, strip,
  # panic=abort). Slower, so a separate job that never blocks `check`.
  release-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - run: rustup override set 1.98.0
      - run: cargo build --release --locked
